<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quest-Stand</title>
<!--
  Diese Seite gehört dem Repo und wird vom Server NIE überschrieben.
  Der Server schreibt nur data/state.json. Aufbau der Daten:
    names   {me, friend}                         Anzeigenamen
    me      {level, xp, xpMax, zone, race, class, faction, questsDone, synced}
    friend  dasselbe oder null (noch kein Sync)
    route   {step, steps, chapter, level, coords, text}   aktueller Schritt von "me" (text enthält <q>Questname</q>)
    quests  [{id, name, level, me, friend, meProgress, friendProgress}]   me/friend: "done" | "open" | null
-->
<style>
/* One screen: a verdict line, four numbers, then both quest books side by side as one table. apple.com type and blue, light only. */
:root {
  color-scheme: light;
  --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --ink2: #6e6e73; --ink3: #86868b; --line: #e8e8ed;
  --blue: #0071e3; --link: #0066cc; --green: #1d9b3a; --orange: #c46a00; --red: #d70015; --amber: #a87a00; --gray: #86868b;
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --fd: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --fm: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--f); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
a { color: var(--ink); text-decoration: none; } a:hover { color: var(--link); text-decoration: underline; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--fm); font-size: .92em; letter-spacing: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 32px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--ink2); }
h1 { font: 700 clamp(28px, 4.4vw, 40px)/1.1 var(--fd); letter-spacing: -.02em; margin: 4px 0 6px; }
.sub { font-size: 17px; color: var(--ink2); max-width: 760px; } .sub b { color: var(--ink); }
.warn { color: var(--red); }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.num { background: var(--card); border-radius: 16px; padding: 14px 16px; }
.num b { display: block; font: 600 30px/1.1 var(--fd); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.num small { font-size: 13px; color: var(--ink2); }
.card { background: var(--card); border-radius: 18px; padding: 18px 20px; min-width: 0; }
.now { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: baseline; }
.now .k { font-size: 13px; font-weight: 600; color: var(--blue); white-space: nowrap; }
.now p { margin: 0; } .now small { grid-column: 2; color: var(--ink3); font-size: 13px; }
q { quotes: none; font-weight: 600; } q::before, q::after { content: none; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.bar h2 { font: 600 19px var(--fd); margin: 0; letter-spacing: -.01em; }
.seg { display: inline-flex; background: #e8e8ed; border-radius: 9px; padding: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { border: 0; background: none; font: 500 13px var(--f); color: var(--ink); padding: 5px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.tw { max-height: min(62vh, 640px); overflow: auto; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; }
thead th { position: sticky; top: 0; background: var(--card); z-index: 1; font-size: 12px; font-weight: 600; color: var(--ink2); text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
thead th.c { text-align: center; width: 30%; }
td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td .qi { display: flex; gap: 10px; align-items: baseline; }
td.c { text-align: center; font-size: 13px; } td.c small { display: block; color: var(--ink3); font-size: 12px; }
tr.band th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink3); padding: 14px 6px 4px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .04em; }
.lv { font: 600 13px var(--f); font-variant-numeric: tabular-nums; min-width: 20px; }
.lv.red { color: var(--red); } .lv.org { color: var(--orange); } .lv.yel { color: var(--amber); } .lv.grn { color: var(--green); } .lv.gry { color: var(--gray); }
.st { font-weight: 700; font-size: 15px; } .st.done { color: var(--green); } .st.open { color: var(--blue); } .st.none { color: var(--ink3); font-weight: 400; }
.ring { display: inline-flex; align-items: center; gap: 5px; font: 600 13px var(--f); font-variant-numeric: tabular-nums; }
.ring svg { width: 18px; height: 18px; }
tr.chain { cursor: pointer; } tr.chain:hover td { background: #fafafc; }
.tg { border: 0; background: none; padding: 0 2px; font: 600 16px var(--f); color: var(--ink3); cursor: pointer; transition: transform .15s; line-height: 1; }
.tg[aria-expanded="true"] { transform: rotate(90deg); }
tr.part td { background: #fafafc; font-size: 14px; } tr.part td:first-child { padding-left: 34px; }
.cls { font-size: 11px; color: var(--ink3); border: 1px solid var(--line); border-radius: 980px; padding: 0 7px; white-space: nowrap; }
.hint { font-size: 13px; color: var(--ink3); margin: -6px 2px 0; }
.legend { font-size: 12px; color: var(--ink3); margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
.empty { padding: 18px 6px; color: var(--ink2); }
@media (max-width: 640px) { .nums { grid-template-columns: repeat(2, minmax(0, 1fr)); } thead th.c { width: 22%; } }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Lädt…</p></div>
<script>
(async () => {
  const app = document.getElementById("app");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const time = t => t ? new Date(t * 1000).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "–";
  let D;
  try { D = await (await fetch("data/state.json?t=" + Date.now(), { cache: "no-store" })).json(); }
  catch { app.innerHTML = '<p class="empty">Noch keine Daten. Sobald der erste Sync durch ist, erscheint hier der Stand.</p>'; return; }

  // Anzeigenamen fest hier, unabhängig von den Namen in state.json
  const NAMES = { me: "Zaki", friend: "Henry" };
  const M = esc(NAMES.me || D.names?.me || "Ich"), F = esc(NAMES.friend || D.names?.friend || "Kumpel");
  const me = D.me || {}, fr = D.friend, L = me.level || 0, Q = D.quests || [];
  const pct = me.xpMax ? Math.round(me.xp / me.xpMax * 100) : 0;
  const lvcls = lv => { const d = (lv || L) - L; return d >= 5 ? "red" : d >= 3 ? "org" : d >= -2 ? "yel" : d >= -8 ? "grn" : "gry"; };

  // class quests (q.classOnly = "Hunter", "Warlock", ...) only one class can do: shown, never counted as missing
  // one row per quest chain; a chain counts once. meDone/meTotal = parts done of the parts that player's class can do
  const heMissing = Q.filter(q => !q.classOnly && (q.meTotal ? q.meDone > q.friendDone : q.me === "done" && q.friend !== "done")).length;
  const iMissing = Q.filter(q => !q.classOnly && (q.friendTotal ? q.friendDone > q.meDone : q.friend === "done" && q.me !== "done")).length;
  const both = Q.filter(q => q.me === "open" && q.friend === "open").length;
  const tog = q => !q.classOnly && ((q.me === "open" && q.friend !== "done") || (q.friend === "open" && q.me !== "done"));
  const CLS = { Hunter: "Jäger", Warlock: "Hexenmeister", Warrior: "Krieger", Shaman: "Schamane", Rogue: "Schurke", Mage: "Magier", Priest: "Priester", Druid: "Druide" };
  const togN = Q.filter(tog).length;

  let lead, sub;
  if (fr) {
    const fl = fr.level || 0;
    lead = L > fl ? `${M} ist weiter: Level ${L} gegen ${fl}.` : fl > L ? `${F} ist weiter: Level ${fl} gegen ${L}.` : `${M} und ${F} sind beide Level ${L}.`;
    sub = heMissing ? `${F} fehlen noch <b>${heMissing}</b> Quests, die ${M} schon abgegeben hat. ` + (togN ? `Zusammen machbar sind schon jetzt <b>${togN}</b>.` : "Danach geht es zusammen weiter.")
      : iMissing ? `${M} fehlen <b>${iMissing}</b> Quests, die ${F} schon hat. Zusammen machbar: <b>${togN}</b>.`
      : `Gleicher Stand. Zusammen machbar: <b>${togN}</b> Quests.`;
    if (fr.faction && me.faction && fr.faction !== me.faction) sub += ' <span class="warn">Achtung: verschiedene Fraktionen, zusammen questen geht nicht.</span>';
  } else {
    lead = `Level ${L}, ${me.questsDone || 0} Quests erledigt.`;
    sub = `Sobald ${F} das Repo eingerichtet hat und <span class="mono">/wp sync</span> macht, stehen hier beide Questbücher nebeneinander.`;
  }

  const ring = (d, t) => {
    const r = 7, c = 2 * Math.PI * r, f = t ? d / t : 0, col = d >= t ? "var(--green)" : d ? "var(--blue)" : "var(--line)";
    return `<span class="ring" title="${d} von ${t} Teilen"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="${r}" fill="none" stroke="var(--line)" stroke-width="2.5"/>`
      + `<circle cx="9" cy="9" r="${r}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 9 9)"/></svg>${d}/${t}</span>`;
  };
  const chainCell = (q, who) => {
    const d = q[who + "Done"], t = q[who + "Total"], p = q[who + "Progress"];
    if (!t) return '<span class="st none" title="Klassenquest">·</span>';
    return ring(d, t) + (p ? `<small>${esc(p)}</small>` : "");
  };
  const cell = (s, p, q) => !s && q && q.classOnly ? '<span class="st none" title="Klassenquest">·</span>' : s === "done" ? '<span class="st done" title="abgegeben">✓</span>'
    : s === "open" ? `<span class="st open" title="im Questlog">●</span><small>${esc(p)}</small>` : '<span class="st none" title="fehlt">–</span>';
  const band = lv => { if (!lv) return "Level unbekannt"; const lo = Math.floor((lv - 1) / 5) * 5 + 1; return `Level ${lo}–${lo + 4}`; };
  let rows = "", last = null, gi = 0;
  for (const q of Q) {
    const b = band(q.level);
    if (b !== last) { rows += `<tr class="band" data-band="1"><th colspan="3">${b}</th></tr>`; last = b; }
    const k = q.me && q.friend ? "both" : q.me ? "me" : "him", chain = (q.parts || []).length > 1, g = ++gi;
    const lvl = `<span class="lv ${q.level ? lvcls(q.level) : "gry"}">${q.level || "·"}</span>`;
    const cls = q.classOnly ? `<small class="cls">${CLS[q.classOnly] || esc(q.classOnly)}-Quest</small>` : "";
    if (chain) {
      rows += `<tr data-k="${k}" data-tog="${tog(q) ? 1 : 0}" class="chain" data-g="${g}"><td><span class="qi">${lvl}<button type="button" class="tg" aria-expanded="false" aria-label="Kette aufklappen">›</button>`
        + `<span>${esc(q.name)} <small class="cls">Kette · ${q.parts.length} Teile</small>${cls}</span></span></td>`
        + `<td class="c">${chainCell(q, "me")}</td><td class="c">${chainCell(q, "friend")}</td></tr>`;
      q.parts.forEach((p, n) => {
        rows += `<tr class="part" data-p="${g}" hidden><td><span class="qi"><span class="lv gry">${n + 1}.</span>`
          + `<a href="https://www.wowhead.com/classic/quest=${p.id}" target="_blank" rel="noopener">${esc(p.name)}</a>${p.cls ? `<small class="cls">${CLS[p.cls] || esc(p.cls)}</small>` : ""}</span></td>`
          + `<td class="c">${cell(p.me, p.meProgress, p.cls ? { classOnly: p.cls } : null)}</td><td class="c">${cell(p.friend, p.friendProgress, p.cls ? { classOnly: p.cls } : null)}</td></tr>`;
      });
    } else {
      rows += `<tr data-k="${k}" data-tog="${tog(q) ? 1 : 0}"><td><span class="qi">${lvl}`
        + `<a href="https://www.wowhead.com/classic/quest=${q.id}" target="_blank" rel="noopener">${esc(q.name)}</a>${cls}</span></td>`
        + `<td class="c">${cell(q.me, q.meProgress, q)}</td><td class="c">${cell(q.friend, q.friendProgress, q)}</td></tr>`;
    }
  }
  const r = D.route || {};
  const routeText = String(r.text || "").replace(/<(?!\/?(q|b)>)[^>]*>/g, "");

  app.innerHTML = `
    <header>
      <div class="eyebrow">Quest-Stand · WoW Forever · ${M}: ${time(me.synced)} · ${F}: ${fr ? time(fr.synced) : "noch kein Sync"}</div>
      <h1>${lead}</h1>
      <div class="sub">${sub}</div>
    </header>
    <div class="nums">
      <div class="num"><b>${fr ? heMissing : "–"}</b><small>Quests fehlen ${F} bis zu ${M}</small></div>
      <div class="num"><b>${fr ? togN : "–"}</b><small>jetzt zusammen machbar</small></div>
      <div class="num"><b>${fr ? both : "–"}</b><small>haben beide im Questlog</small></div>
      <div class="num"><b>${fr ? iMissing : "–"}</b><small>Quests fehlen ${M} von ${F}</small></div>
    </div>
    <p class="hint">„Zusammen machbar“: einer hat die Quest im Log, der andere hat sie noch nicht abgegeben und kann sie annehmen. „Im Questlog“: beide haben sie schon angenommen. Questketten und doppelte Quests zählen als eine, Klassenquests gar nicht.</p>
    <div class="card now"><span class="k">${M} gerade</span><p>${routeText}</p>
      <small>Level ${L} · ${pct} % · ${esc(me.zone)} · Schritt ${r.step || "?"} von ${r.steps || "?"}${r.coords ? ` · <span class="mono">${esc(r.coords)}</span>` : ""}</small></div>
    <div class="card">
      <div class="bar"><h2>Questbuch-Vergleich</h2>
        <div class="seg" role="group" aria-label="Filter">
          <button type="button" data-f="all" aria-pressed="true">Alle</button>
          <button type="button" data-f="tog" aria-pressed="false">Zusammen machbar</button>
          <button type="button" data-f="me" aria-pressed="false">Nur ${M}</button>
          <button type="button" data-f="him" aria-pressed="false">Nur ${F}</button>
          <button type="button" data-f="both" aria-pressed="false">Beide</button>
        </div></div>
      <div class="tw"><table><thead><tr><th>Quest</th><th class="c">${M} (L${L})</th><th class="c">${F}${fr ? ` (L${fr.level})` : ""}</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="3" class="empty">Noch keine Questdaten.</td></tr>'}</tbody></table></div>
      <div class="legend"><span><span class="st done">✓</span> abgegeben</span><span><span class="st open">●</span> im Questlog, mit Fortschritt</span><span><span class="st none">–</span> fehlt</span><span>Zahl vorne = Quest-Level</span><span>Klassenquests zählen nicht als fehlend</span><span>Kreis = Teile einer Questkette, Zeile anklicken zum Aufklappen</span></div>
    </div>`;

  const trs = [...app.querySelectorAll("tbody tr")].filter(tr => !tr.classList.contains("part"));
  app.querySelector("tbody").addEventListener("click", e => {
    const row = e.target.closest("tr.chain"); if (!row || e.target.closest("a")) return;
    const btn = row.querySelector(".tg"), open = btn.getAttribute("aria-expanded") !== "true";
    btn.setAttribute("aria-expanded", open);
    app.querySelectorAll(`tr.part[data-p="${row.dataset.g}"]`).forEach(tr => tr.hidden = !open || row.hidden);
  });
  app.querySelector(".seg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const f = b.dataset.f, bands = [];
    trs.forEach(tr => {
      if (tr.dataset.band) { bands.push([tr, 0]); return; }
      const ok = f === "all" || (f === "tog" ? tr.dataset.tog === "1" : tr.dataset.k === f);
      tr.hidden = !ok; if (ok && bands.length) bands[bands.length - 1][1]++;
    });
    bands.forEach(([tr, n]) => tr.hidden = n === 0);
    app.querySelectorAll("tr.chain").forEach(row => {
      const open = row.querySelector(".tg").getAttribute("aria-expanded") === "true";
      app.querySelectorAll(`tr.part[data-p="${row.dataset.g}"]`).forEach(tr => tr.hidden = !open || row.hidden);
    });
    app.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
})();
</script>
</body>
</html>
